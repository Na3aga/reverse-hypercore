[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
commonware-consensus = "2026.9.0"
commonware-runtime = "2026.9.0"
commonware-p2p = "2026.9.0"
commonware-cryptography = "2026.9.0"
commonware-codec = "2026.9.0"
commonware-utils = "2026.9.0"
commonware-macros = "2026.9.0"
commonware-parallel = "2026.9.0"
commonware-actor = "2026.9.0"
bytes = "1"
rand_core = { version = "0.10", default-features = false }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order: action JSON keeps field order, which signing hashes (msgpack).
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
postcard = { version = "1", features = ["use-std"] }
revm = { version = "43.0.3", default-features = false, features = ["std", "serde", "optional_balance_check", "optional_block_gas_limit", "optional_eip3607"] }
alloy-primitives = { version = "1.7", features = ["serde", "k256"] }
alloy-consensus = { version = "2.5", features = ["k256"] }
alloy-eips = "2.5"
alloy-rlp = "0.3"
alloy-sol-types = "1.7"
alloy-signer = "2.5"
alloy-signer-local = "2.5"

# Local copy of commonware-runtime with one benchmark-only switch
# (HC_BENCH_NO_FSYNC, off by default). See vendor/commonware-runtime/src/storage/tokio/blob.rs.
[patch.crates-io]
commonware-runtime = { path = "vendor/commonware-runtime" }
